<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>House Price Predictor</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #f6f3ea;
      color: #1c2321;
    }
  </style>
</head>
<body>
  <p>Loading House Price Predictor...</p>
  <script>
    (function () {
      var url = 'https://raw.githubusercontent.com/Sanjay-AI-ML/SCT_ML_1/sanjay-ai-ml-deploy-price-predictor/outputs/price_predictor.html';

      fetch(url)
        .then(function (response) {
          if (!response.ok) {
            throw new Error('Unable to load deployed predictor.');
          }
          return response.text();
        })
        .then(function (html) {
          document.open();
          document.write(html);
          document.close();
        })
        .catch(function () {
          document.body.innerHTML = '<p>Deployment is not ready yet. Please try again shortly.</p>';
        });
    })();
  </script>
</body>
</html>
